
name: Build Happy Birds for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Happy_Birds_project/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Happy_Birds_project

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build portable app
        run: npm run build

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Happy-Birds-Windows-Portable
          path: Happy_Birds_project/dist/*.exe
          if-no-files-found: error
          retention-days: 14
